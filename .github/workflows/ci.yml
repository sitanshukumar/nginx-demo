name: CI Pipeline

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: nginx-demo
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Display Repository
        run: |
          pwd
          ls -R

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:latest \
            .

      - name: Verify Docker Image
        run: |
          docker images

      # Scan the LOCAL image
      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:latest
          severity: HIGH,CRITICAL
          exit-code: '0'
          ignore-unfixed: true

      # Login to Azure
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Login to ACR
      - name: Login to Azure Container Registry
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}

      # Tag image for ACR
      - name: Tag Docker Image
        run: |
          docker tag \
            ${{ env.IMAGE_NAME }}:latest \
            ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      # Push to ACR
      - name: Push Docker Image
        run: |
          docker push \
            ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Display Pushed Image
        run: |
          echo "Image pushed successfully:"
          echo "${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"# Clone GitOps Repository
      - name: Clone GitOps Repository
        run: |
          git clone https://x-access-token:${{ secrets.GITOPS_TOKEN }}@github.com/${{ secrets.GITOPS_REPO }}.git gitops

      # Install yq
      - name: Install yq
        run: |
          sudo wget -O /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      # Update Helm values.yaml
      - name: Update Image Tag
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          yq -i '.image.tag = env(IMAGE_TAG)' gitops/nginx/values.yaml

      # Show the updated file (optional)
      - name: Verify values.yaml
        run: |
          cat gitops/nginx/values.yaml

      # Commit and Push
      - name: Commit and Push GitOps Changes
        run: |
          cd gitops

          git config user.name "sitanshu"
          git config user.email "sitanshukumar1988@gmail.com"

          git add nginx/values.yaml

          git commit -m "Update nginx image to ${IMAGE_TAG}" || echo "No changes to commit"

          git push origin master
      
