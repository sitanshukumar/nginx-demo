name: CI Pipeline

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: nginx-demo

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Display Repository
        run: |
          pwd
          ls -R

      - name: Build Docker Image
        run: |
          docker build -t ${IMAGE_NAME}:latest .

      - name: Verify Docker Image
        run: |
          docker images
